name: Draft patch release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-patch
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from the main branch."
          exit 1
      - name: Check out repository
        # https://github.com/actions/checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run offline checks
        run: |
          make test
          python3 -m compileall -q bot/telegram/bloc_bridge scripts/telegram_chat_id.py
      - name: Create next patch tag
        id: version
        # https://github.com/mathieudutour/github-tag-action
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ github.token }}
          release_branches: main
          force_bump: patch
          create_annotated_tag: true
      - name: Create draft release
        # https://github.com/ncipollo/release-action
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.new_tag }}
          draft: true
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.version.outputs.previous_tag }}
