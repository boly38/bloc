name: Draft release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semantic version bump for the next release
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from the main branch."
          exit 1
      - name: Check out repository
        # https://github.com/actions/checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python
        # https://github.com/actions/setup-python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install test reporting tools
        run: python3 -m pip install -r requirements-ci.txt
      - name: Run unit tests
        id: unit_tests
        run: python3 -m xmlrunner discover -s tests -v -o test-reports
      - name: Publish test report
        if: ${{ !cancelled() && (steps.unit_tests.outcome == 'success' || steps.unit_tests.outcome == 'failure') }}
        uses: mikepenz/action-junit-report@v6
        with:
          report_paths: test-reports/TEST-*.xml
          annotate_only: true
          include_time_in_summary: true
          require_tests: true
          fail_on_parse_error: true
      - name: Check Python syntax
        run: python3 -m compileall -q bot/telegram/bloc_bridge scripts/telegram_chat_id.py
      - name: Create next release tag
        id: version
        # https://github.com/mathieudutour/github-tag-action
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ github.token }}
          release_branches: main
          force_bump: ${{ inputs.bump }}
          create_annotated_tag: true
      - name: Create draft release
        # https://github.com/ncipollo/release-action
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ steps.version.outputs.new_tag }}
          draft: true
          generateReleaseNotes: true
          generateReleaseNotesPreviousTag: ${{ steps.version.outputs.previous_tag }}
