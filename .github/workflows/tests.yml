name: Tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Run unit tests
        run: make test
      - name: Check Python syntax
        run: python3 -m compileall -q bot/telegram/bloc_bridge scripts/telegram_chat_id.py
      - name: Validate Compose in both launch modes
        run: |
          env_file="$(mktemp)"
          trap 'rm -f "$env_file"' EXIT
          cat > "$env_file" <<'EOF'
          TELEGRAM_ENABLED=false
          TELEGRAM_BOT_TOKEN=ci-placeholder
          TELEGRAM_ALLOWED_CHAT_IDS=123456789
          OPPER_API_KEY=ci-placeholder
          OPENCODE_SERVER_PASSWORD=ci-placeholder
          OPPER_MODEL=gpt-5.6-luna
          OPPER_VARIANT=medium
          OPENCODE_IMAGE=ghcr.io/anomalyco/opencode@sha256:6176a71bf7c1352d9aa9e7f112a4ef38443079a2f435789a33dd5ae809acea1a
          EOF
          make config ENV_FILE="$env_file"
          TELEGRAM_ENABLED=true make config ENV_FILE="$env_file"
