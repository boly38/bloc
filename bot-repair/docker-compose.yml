name: ${BLOC_PROJECT_NAME:-bloc-v2}-repair

# This Compose stack is intentionally independent so a diagnostic shell can be opened
# even if the main Compose stack fails to start.
services:
  repair:
    image: "${OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode@sha256:6176a71bf7c1352d9aa9e7f112a4ef38443079a2f435789a33dd5ae809acea1a}"
    entrypoint: ["/bin/sh"]
    stdin_open: true
    tty: true
    volumes:
      - opencode-data:/root/.local/share/opencode
      - workspace:/workspace
      - ../bot/opencode.json:/tmp/bloc-opencode.json:ro
    working_dir: /workspace
    environment:
      OPENCODE_SERVER_PASSWORD: ${OPENCODE_SERVER_PASSWORD:?Set a strong OPENCODE_SERVER_PASSWORD for OpenCode v2}
      OPENCODE_CONFIG: /tmp/bloc-opencode.json

volumes:
  opencode-data:
    external: true
    name: ${BLOC_PROJECT_NAME:-bloc-v2}_opencode-data
  workspace:
    external: true
    name: ${BLOC_PROJECT_NAME:-bloc-v2}_workspace
