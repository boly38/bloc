name: bloc-repair

# This Compose stack is intentionally independent so a diagnostic shell can be opened
# even if the main Compose stack fails to start.
services:
  repair:
    image: "${OPENCODE_IMAGE:-ghcr.io/anomalyco/opencode@sha256:6ebc13097f2381301220abe9d1b2a54f50cd1603a910dc1c66e93d8f2c4e8ebb}"
    entrypoint: ["/bin/sh"]
    stdin_open: true
    tty: true
    volumes:
      - opencode-data:/root/.local/share/opencode
      - workspace:/workspace
      - ../bot/opencode.json:/workspace/opencode.json:ro
    working_dir: /workspace

volumes:
  opencode-data:
    external: true
    name: bloc_opencode-data
  workspace:
    external: true
    name: bloc_workspace
